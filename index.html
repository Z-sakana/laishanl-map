<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>仙境海岸·莱山文旅共建导览图</title>
    <style>
        :root { --main-color: #007AFF; --panel-bg: rgba(255, 255, 255, 0.95); }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: -apple-system, "Helvetica Neue", sans-serif; }
        #container { width: 100%; height: 100%; }
        .top-nav {
            position: fixed; top: 10px; left: 10px; right: 10px; z-index: 1000;
            background: var(--panel-bg); padding: 12px 15px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .top-nav h1 { margin: 0; font-size: 16px; color: #333; letter-spacing: 1px; }
        .post-card {
            position: fixed; bottom: 20px; left: 15px; right: 15px; z-index: 1001;
            background: var(--panel-bg); border-radius: 16px; padding: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1); transform: translateY(150%); transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        .post-card.active { transform: translateY(0); }
        .post-card h2 { margin: 0 0 10px 0; font-size: 18px; color: var(--main-color); }
        .input-box { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #eee; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; }
        .submit-btn { background: var(--main-color); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .close-hint { font-size: 12px; color: #999; text-align: center; margin-top: 10px; display: block; cursor: pointer; }
    </style>
</head>
<body>

<div class="top-nav">
    <h1>🌊 数字人文莱山文旅地图</h1>
    <div style="font-size: 12px; color: var(--main-color); font-weight: bold;">点地图选位</div>
</div>

<div id="container"></div>

<div class="post-card" id="postCard">
    <h2>📍 推荐新发现</h2>
    <p style="font-size: 13px; color: #666; margin: 5px 0;">该位置已锁定。请输入地名并提交至 GitHub 审核：</p>
    <input type="text" id="placeName" class="input-box" placeholder="例如：滨海路落日秋千">
    <button class="submit-btn" onclick="openGithubIssue()">提交投稿</button>
    <span class="close-hint" onclick="hideCard()">点击空白处取消</span>
</div>

<script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=df797c694357b52d4bb481b2ff33700c"></script>

<script>
    const map = new AMap.Map('container', {
        zoom: 13.5,
        center: [121.455, 37.485],
        viewMode: '3D',
        mapStyle: 'amap://styles/macaron'
    });

    AMap.plugin(['AMap.Geolocation', 'AMap.ControlBar'], function() {
        const geo = new AMap.Geolocation({
            buttonPosition: 'RB',
            buttonOffset: new AMap.Pixel(20, 80),
            zoomToAccuracy: true
        });
        map.addControl(geo);
        map.addControl(new AMap.ControlBar({ position: { top: '80px', right: '15px' } }));
    });

    const spots = [
        { name: "海昌渔人码头", pos: [121.453285, 37.518549], desc: "欧式小镇与海边木栈道，入海轨道打卡点" },
        { name: "17咖啡馆", pos: [121.478163, 37.467558], desc: "趣浪公园的，海景咖啡馆" },
        { name: "第二海水浴场", pos: [121.448278, 37.520818], desc: "目前封闭维修中" },
        { name: "三元湖", pos: [121.457449, 37.475176], desc: "烟大内湖" },
        { name: "132军舰", pos: [121.450035, 37.494777], desc: "沿海军舰，摄影较佳出片点" },
    ];

    spots.forEach(spot => {
        const marker = new AMap.Marker({
            position: spot.pos,
            title: spot.name,
            map: map
        });
        marker.on('click', () => {
            new AMap.InfoWindow({
                content: `<div style="padding:5px;"><b>${spot.name}</b><br><small>${spot.desc}</small></div>`,
                offset: new AMap.Pixel(0, -30)
            }).open(map, spot.pos);
        });
    });

    let tempCoords = null;
    map.on('click', (e) => {
        tempCoords = e.lnglat;
        document.getElementById('postCard').classList.add('active');
    });

    function hideCard() {
        document.getElementById('postCard').classList.remove('active');
    }

    function openGithubIssue() {
        const name = document.getElementById('placeName').value;
        if (!name) return alert("请先给这个地点起个名字吧！");

        const USER = "Z-sakana"; 
        const REPO = "laishanl-map"; 

        const title = encodeURIComponent(`[投稿] ${name}`);
        const body = encodeURIComponent(
            `地点名称: ${name}\n` +
            `地理坐标: ${tempCoords.lng}, ${tempCoords.lat}\n` +
            `--- \n(请在此补充您的推荐语，审核后将出现在地图中)`
        );

        window.open(`https://github.com/${USER}/${REPO}/issues/new?title=${title}&body=${body}`);
        hideCard();
    }
</script>
</body>
</html>
